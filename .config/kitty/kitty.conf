# Colors: the palette in colors.conf, the same values as ~/.config/quickshell/Theme.qml; the accent, taken from the wallpaper, in accent.conf
include colors.conf
include accent.conf

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.5

# Solid here: mango already makes every window translucent (focused_opacity / unfocused_opacity in mango/config.conf)
background_opacity 1.0
dynamic_background_opacity yes

# TOP RIGHT BOTTOM LEFT; the left is 1.5 pt (2 px) wider so fastfetch's picture sits as far from the left edge as from the top
window_padding_width 4 4 4 5.5
# Spare pixels (a window is rarely an exact number of cells) go to the right and bottom edges, so the top and left gaps never change
placement_strategy top-left
confirm_os_window_close 0

cursor_shape beam
cursor_blink_interval 0.5

enable_audio_bell no
