# version: 1.0.0
"$schema" = 'https://starship.rs/config-schema.json'

palette = "wallpaper"
add_newline = false
continuation_prompt = "[▸▹ ](white)"

format = """($container$git_metrics\n)$cmd_duration\
${env_var.SSH_CONNECTION}\
$username\
$hostname\
$localip\
$shlvl\
$shell\
$env_var\
$jobs\
$sudo\
$character"""

right_format = """
$singularity\
$kubernetes\
$directory\
$vcsh\
$fossil_branch\
$git_branch\
$git_commit\
$git_state\
$git_status\
$hg_branch\
$pijul_channel\
$docker_context\
$package\
$c\
$cpp\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$golang\
$guix_shell\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$gradle\
$lua\
$maven\
$nim\
$nodejs\
$bun\
$ocaml\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$vlang\
$vagrant\
$xmake\
$zig\
$buf\
$conda\
$pixi\
$meson\
$spack\
$memory_usage\
$aws\
$gcloud\
$openstack\
$azure\
$crystal\
$custom\
$status\
$os\
$battery\
$time"""

# Accents: kitty's ANSI slots, so each machine's kitty theme sets them (bright-white = text, white = mid grey).
[palettes.wallpaper]
primary   = "bright-white"
secondary = "bright-white"
tertiary  = "white"
error     = "white"
surface_high = "bright-black"

[character]
format = "$symbol "
success_symbol = "[◎](bold italic primary)"
error_symbol = "[○](italic error)"
vimcmd_symbol = "[■](italic green)"
# not supported in zsh
vimcmd_replace_one_symbol = "◌"
vimcmd_replace_symbol = "□"
vimcmd_visual_symbol = "▼"

[env_var.SSH_CONNECTION]
format = "[󰣀 ](bold green)"

[env_var.VIMSHELL]
format = "[$env_value]($style)"
style = 'green italic'

[sudo]
format = "[$symbol]($style)"
style = "bold italic tertiary"
symbol = "⋈┈"
disabled = false

[username]
style_user = "primary bold italic"
style_root = "error bold italic"
format = "[$user]($style)"
disabled = false
show_always = false

[directory]
# home_symbol = ""
truncation_length = 2
truncation_symbol = " "
read_only = " 󰌾"
use_os_path_sep = true
style = "italic primary"
format = '[$path]($style)[$read_only]($read_only_style)'
repo_root_style = 'bold primary'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) [](bold tertiary)'

[cmd_duration]
format = "[◄ $duration ](italic white)"

[jobs]
format = "[$symbol$number]($style) "
style = "white"
symbol = "[▶](blue italic)"

[localip]
ssh_only = true
format = "[󰩟 $localipv4](bold purple) "
disabled = false

[time]
disabled = false
format = "[ $time]($style)"
time_format = "%R"
utc_time_offset = "local"
style = "italic white"

[battery]
format = "[ $percentage $symbol]($style)"
full_symbol = "█"
charging_symbol = "[↑](italic bold green)"
discharging_symbol = "↓"
unknown_symbol = "░"
empty_symbol = "▃"

[[battery.display]]
threshold = 20
style = "italic bold red"

[[battery.display]]
threshold = 60
style = "italic bright-purple"

[[battery.display]]
threshold = 70
style = "italic yellow"

[git_branch]
format = " [$branch(:$remote_branch)]($style)"
symbol = "[](bold italic tertiary)"
style = "italic secondary"
truncation_symbol = "⋯"
truncation_length = 11
only_attached = true

[git_metrics]
format = '([▴$added]($added_style))([▿$deleted]($deleted_style))'
added_style = 'italic green'
deleted_style = 'italic red'
ignore_submodules = true
disabled = false

[git_status]
style = "bold italic secondary"
format = "([⎪$ahead_behind$staged$modified$untracked$renamed$deleted$conflicted$stashed⎥]($style))"
conflicted = "[◪◦](italic bright-purple)"
ahead = "[▴│[${count}](bold white)│](italic green)"
behind = "[▿│[${count}](bold white)│](italic red)"
diverged = "[◇ ▴┤[${ahead_count}](regular white)│▿┤[${behind_count}](regular white)│](italic bright-purple)"
untracked = "[◌◦](italic bright-yellow)"
stashed = "[◃◈](italic white)"
modified = "[●◦](italic yellow)"
staged = "[▪┤[$count](bold white)│](italic bright-cyan)"
renamed = "[◎◦](italic bright-blue)"
deleted = "[✕](italic red)"

[deno]
format = " [deno](italic) [ $version](green bold)"
version_format = "${raw}"

[lua]
format = " [lua](italic) [${symbol}${version}]($style)"
version_format = "${raw}"
symbol = " "
style = "bold bright-yellow"

[nodejs]
format = " [node](italic) [ ($version)](bold bright-green)"
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []

[bun]
format = " [bun](italic) [ ($version)](bold bright-green)"
version_format = "${raw}"

[python]
format = " [py](italic) [${symbol}${version}]($style)"
symbol = " "
version_format = "${raw}"
style = "bold bright-yellow"

[ruby]
format = " [rb](italic) [${symbol}${version}]($style)"
symbol = " "
version_format = "${raw}"
style = "bold red"

[rust]
format = " [rs](italic) [$symbol$version]($style)"
symbol = "󱘗 "
version_format = "${raw}"
style = "bold red"

[package]
format = " [pkg](italic) [$symbol$version]($style)"
version_format = "${raw}"
symbol = "󰏗 "
style = "yellow italic bold"

[swift]
format = " [sw](italic) [${symbol}${version}]($style)"
symbol = " "
style = "bold bright-red"
version_format = "${raw}"

[aws]
disabled = true
format = " [aws](italic) [$symbol $profile $region]($style)"
style = "bold blue"
symbol = " "

[buf]
symbol = " "
format = " [buf](italic) [$symbol $version $buf_version]($style)"

[c]
symbol = " "
format = " [$symbol($version(-$name))]($style)"

[cpp]
symbol = " "
format = " [$symbol($version(-$name))]($style)"

[conda]
symbol = " "
format = " conda [$symbol$environment]($style)"

[pixi]
symbol = "󰏗 "
format = " pixi [$symbol$version ($environment )]($style)"

[dart]
symbol = " "
format = " dart [$symbol($version )]($style)"

[docker_context]
symbol = " "
format = " docker [$symbol$context]($style)"

[elixir]
symbol = " "
format = " exs [$symbol $version OTP $otp_version ]($style)"

[elm]
symbol = " "
format = " elm [$symbol($version )]($style)"

[golang]
symbol = " "
format = " go [$symbol($version )]($style)"

[haskell]
symbol = " "
format = " hs [$symbol($version )]($style)"

[java]
symbol = " "
style = "red"
format = " java [${symbol}(${version} )]($style)"

[julia]
symbol = " "
format = " jl [$symbol($version )]($style)"

[memory_usage]
symbol = "󰍛 "
style = "white bold"
format = " mem [${ram}( ${swap})]($style)"

[nim]
symbol = " "
format = " nim [$symbol($version )]($style)"

[nix_shell]
disabled = true

[custom.nixshell]
when = '[[ "$PATH" == /nix/store/* ]]'
command = 'echo nix-shell'
shell = ["bash", "--noprofile", "--norc"]
style = "fg:green"
format = " [  $output]($style)"

[spack]
symbol = " "
format = " spack [$symbol$environment]($style)"

# Starship's own styles for these are "dimmed", which kitty draws at 40 %, too faint to read.
[hostname]
format = "[@$hostname]($style) "
style = "green bold"

[container]
style = "red bold"

[netns]
style = "blue bold"

[singularity]
style = "blue bold"
