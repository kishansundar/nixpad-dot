# The accent matugen takes from the wallpaper, for mango: the focused window's border, the split line and the drop preview; the bar reads focus_color from the copy matugen writes to ~/.config/mango/colors.conf
focus_color=0x{{colors.source_color.default.hex_stripped}}ff
split_color=0x{{colors.source_color.default.hex_stripped}}ff
drop_color=0x{{colors.source_color.default.hex_stripped}}55
