general {
    # The cover of what is playing is looked up first, so the lock screen
    # starts with it.
    lock_cmd = pidof hyprlock || { ~/.config/hypr/lock-media prepare; hyprlock; }
    before_sleep_cmd = loginctl lock-session
    # After a wake the lock screen starts again, so it takes the fingerprint reader again.
    after_sleep_cmd = pkill -x hyprlock; sleep 1; loginctl lock-session
}

# Screensaver (matrix rain) after 3 minutes without input, closed on the first input; its terminal also reads screensaver.conf, where matugen puts the wallpaper's accent as the rain's colour.
listener {
    timeout = 180
    on-timeout = kitty --class screensaver --config ~/.config/kitty/kitty.conf --config ~/.config/kitty/screensaver.conf cmatrix -b -s
    on-resume = pkill -f '[k]itty --class screensaver'
}

# Lock after 4 minutes without input.
listener {
    timeout = 240
    on-timeout = loginctl lock-session
}

# Screens off 10 seconds after the lock, back on at the first input.
listener {
    timeout = 250
    on-timeout = wlopm --off '*'
    on-resume = wlopm --on '*'
}

# Suspend after 15 minutes without input, but not while an external monitor is attached (the laptop would wake again at once); asked again every minute, so it sleeps once the monitor is unplugged.
listener {
    timeout = 900
    condition_cmd = ! grep -qs '^connected' /sys/class/drm/card*-DP-*/status /sys/class/drm/card*-HDMI-*/status
    condition_retry = 60
    on-timeout = systemctl suspend
}
