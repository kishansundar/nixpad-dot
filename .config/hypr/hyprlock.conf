# Colors: the palette in hyprlock-colors.conf; the background is the wallpaper in use (~/.config/mango/current-wallpaper).
source = ~/.config/hypr/hyprlock-colors.conf
# The cover to start with: lock-media writes it just before each locking.
source = ~/.config/hypr/hyprlock-cover.conf

$font = JetBrainsMono Nerd Font
$iconFont = JetBrainsMono Nerd Font

general {
    # Shown, so the buttons under the cover can be clicked.
    hide_cursor = false
    ignore_empty_input = true
}

# Password and fingerprint work side by side. Fingerprint is disabled in
# hyprlock's PAM service (modules/desktop.nix) so it never blocks typing.
auth {
    fingerprint {
        enabled = true
        ready_message = SCAN FINGERPRINT OR TYPE PASSWORD
        present_message = SCANNING...
    }
}

animations {
    enabled = true
    bezier = smooth, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 4, smooth
    animation = inputFieldDots, 1, 2, smooth
}

background {
    monitor =
    path = ~/.config/mango/current-wallpaper
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
    vibrancy = 0.17
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 96
    font_family = $font Bold
    position = 0, 190
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%^A  /  %d %^B"
    color = $text_dim
    font_size = 18
    font_family = $font
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    rounding = 0
    outline_thickness = 2
    inner_color = $field
    outer_color = $accent
    check_color = $text
    fail_color = $error
    capslock_color = $accent_alt
    font_color = $text
    font_family = $font
    placeholder_text = PASSWORD
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_size = 0.22
    dots_spacing = 0.35
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}

# Fingerprint prompt / status
label {
    monitor =
    text = $FPRINTPROMPT
    color = $text_dim
    font_size = 11
    font_family = $font
    position = 0, -100
    halign = center
    valign = center
}

# Battery
label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT*/capacity)%"
    color = $text_dim
    font_size = 11
    font_family = $iconFont
    position = -24, 20
    halign = right
    valign = bottom
}

# What is playing: the cover with the title and artist under it, low in the
# middle, and previous / play-pause / next under those, to click. Nothing
# shows while no player has a track. lock-media says which player counts,
# fetches the cover and works the buttons. (The media keys work while
# locked too.) Each of these asks lock-media again every few seconds for as
# long as the screen is locked, so they ask no more often than they need.
image {
    monitor =
    path = $cover
    size = 96
    rounding = 0
    border_size = 0
    reload_time = 2
    reload_cmd = ~/.config/hypr/lock-media cover
    position = 0, 196
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/lock-media text
    text_align = center
    color = $text
    font_size = 13
    font_family = $font
    position = 0, 136
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/lock-media button previous
    onclick = ~/.config/hypr/lock-media previous
    color = $text_dim
    font_size = 20
    font_family = $iconFont
    position = -64, 78
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/lock-media button toggle
    onclick = ~/.config/hypr/lock-media toggle
    color = $accent
    font_size = 26
    font_family = $iconFont
    position = 0, 74
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/lock-media button next
    onclick = ~/.config/hypr/lock-media next
    color = $text_dim
    font_size = 20
    font_family = $iconFont
    position = 64, 78
    halign = center
    valign = bottom
}
