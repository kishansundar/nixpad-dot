# Colours for the lock screen: the fixed palette of ~/.config/quickshell/Theme.qml plus the accent matugen takes from the wallpaper; matugen writes ~/.config/hypr/hyprlock-colors.conf from ~/.config/matugen/templates/hyprlock-colors.conf at each wallpaper change, so changes belong in that template
$text = rgb(F4E8D0)
$text_dim = rgba(F4E8D0b3)
$accent = rgb(4d57ff)
$accent_alt = rgb(FF9955)
$field = rgba(101226a6)
$outline = rgba(39344F66)
$error = rgb(FF5555)
