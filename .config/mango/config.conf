# Blur: a see-through window shows a soft blur of the wallpaper behind it, so the text of a window underneath does not show through; the blurred wallpaper is made once and kept (blur_optimized), and the bar and its panels are not blurred (blur_layer)
blur=1
blur_layer=0
blur_optimized=1

# Shadows: off, under windows and under the shell's panels
shadows = 0
layer_shadows = 0

border_radius=0
no_radius_when_single=0
focused_opacity=0.92
unfocused_opacity=0.87

# Animation Configuration
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.7
fade_in_begin_opacity=0.8
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=400
animation_curve_open=0.46,1.0,0.29,1.1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.58,0.98,0.58,0.98
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_ignore_proportion_single=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
smart_gaps=0
default_master_factor=0.55
default_master_count=1

#Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=1

# Overview Setting
hotarea_size=10
enable_hotarea=1
overview_gap_inner=5
overview_gap_outer=30

# Misc
xwayland_persistence=0
sync_obj_enable=1
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
tag_num=5
circle_layout=dwindle,monocle
enable_floating_snap=1
snap_distance=50
cursor_size=24
cursor_theme=Bibata-Modern-Ice
cursor_hide_timeout=0
drag_tile_to_tile=1
single_scratchpad = 1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=1
xkb_rules_layout=us

# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
mouse_natural_scrolling=0
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1
mouse_accel_profile=2
mouse_accel_speed=0.0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=5
gap_outer_vertical=5
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2
# Colours, the same values as ~/.config/quickshell/Theme.qml: dark purple on unfocused windows, deep indigo behind the wallpaper; orange, cream and cyan mark a window's state (the accent on the focused window is in colors.conf)
border_color=0x39344Fff
root_color=0x0B0D1Aff
maximized_screen_color=0xF4E8D0ff
urgent_color=0xFF9955ff
scratchpad_color=0x54E7F2ff
global_color=0x54E7F2ff
overlay_color=0x54E7F2ff

# sub config load
source=./bind.conf
source=./rule.conf
source=./tag.conf
source=./colors.conf
source=./monitors.conf

# run autostart
exec_once=~/.config/mango/autostart.sh

# lid: run at login and at every reload (Super+R, a wallpaper change, a saved config file); a reload turns all screens on, so this turns the laptop screen off again while the lid is closed
exec=grep -q closed /proc/acpi/button/lid/*/state && mmsg dispatch disable_monitor,eDP-1
