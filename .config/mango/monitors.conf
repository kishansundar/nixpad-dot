# monitors: one line per screen, written by the bar's displays panel (Super+P): size, refresh rate (1000 asks for the highest the screen offers), scale, rotation (rr), VRR always on (vrr) and place (x, y); the first line is for any external screen, and VRR in full screen only is a window rule in rule.conf
monitor_rule=name:^(DP|HDMI-A)-[0-9]+$,width:3840,height:2160,refresh:240,x:0,y:0
monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:1000,x:760,y:1440
