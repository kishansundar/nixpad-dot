# layer rule
layer_rule=no_animation:1,no_blur:1,layer_name:selection

# layer rule: the bar, its panels and the dock appear at once, with no slide; a name matches anywhere in a layer's name, so this also covers quickshell-bar and quickshell-unseen
layer_rule=no_animation:1,layer_name:quickshell

# window rule: a clicked notification may focus its app's window
window_rule=activation_bypass:1,app_id:.*

# window rule: VRR (G-Sync) is on only while a full-screen window has the focus
window_rule=vrr_only_fullscreen:1,app_id:.*

# window rule: the browsers are drawn solid, not see-through
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:^(zen|helium)$

# window rule: the screensaver fills the screen and is drawn solid
window_rule=is_fullscreen:1,focused_opacity:1.0,unfocused_opacity:1.0,app_id:^screensaver$
